<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <g fill="none" stroke="#3A1E0D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.065">
    
    <!-- 1. Balok Keju Khas Kemasan Lestari (Kiri Atas) -->
    <g transform="translate(25, 25) rotate(-12)">
      <!-- Bentuk kotak / balok keju -->
      <path d="M 5 15 L 45 5 L 60 22 L 20 32 Z" />
      <path d="M 5 15 L 5 35 L 20 52 L 20 32" />
      <path d="M 20 52 L 60 42 L 60 22" />
      <!-- Lubang-lubang keju khas kemasan -->
      <circle cx="28" cy="18" r="4.5" />
      <circle cx="48" cy="15" r="3.5" />
      <circle cx="38" cy="25" r="3" />
      <circle cx="12" cy="28" r="2.5" />
      <circle cx="35" cy="40" r="4" />
      <circle cx="50" cy="34" r="3" />
    </g>

    <!-- 2. Makaroni Tebal Khas Kemasan (Kanan Atas) -->
    <g transform="translate(170, 35) rotate(25)">
      <!-- Bentuk tabung melengkung tebal dengan ujung oval -->
      <path d="M 10 35 C 10 10, 50 10, 50 35 C 50 39, 42 41, 38 37 C 38 22, 22 22, 22 37 C 18 41, 10 39, 10 35 Z" />
      <!-- Garis lipatan / alur kerenyahan di punggung makaroni -->
      <path d="M 24 14 C 28 20, 32 20, 36 14" stroke-width="1.6" />
      <path d="M 28 24 C 30 27, 32 27, 34 24" stroke-width="1.6" />
    </g>

    <!-- 3. Balok Keju Khas Kemasan Lestari (Kanan Bawah) -->
    <g transform="translate(180, 160) rotate(18)">
      <path d="M 5 15 L 45 5 L 60 22 L 20 32 Z" />
      <path d="M 5 15 L 5 35 L 20 52 L 20 32" />
      <path d="M 20 52 L 60 42 L 60 22" />
      <circle cx="26" cy="18" r="4" />
      <circle cx="45" cy="14" r="3" />
      <circle cx="36" cy="26" r="3.5" />
      <circle cx="13" cy="26" r="2.5" />
      <circle cx="38" cy="42" r="4.5" />
      <circle cx="52" cy="32" r="2.5" />
    </g>

    <!-- 4. Makaroni Tebal Khas Kemasan (Kiri Bawah) -->
    <g transform="translate(30, 170) rotate(-35)">
      <path d="M 10 35 C 10 10, 50 10, 50 35 C 50 39, 42 41, 38 37 C 38 22, 22 22, 22 37 C 18 41, 10 39, 10 35 Z" />
      <path d="M 24 14 C 28 20, 32 20, 36 14" stroke-width="1.6" />
      <path d="M 28 24 C 30 27, 32 27, 34 24" stroke-width="1.6" />
    </g>

    <!-- 5. Makaroni Tengah Miring (Center Piece) -->
    <g transform="translate(115, 105) rotate(70)">
      <path d="M 8 30 C 8 8, 44 8, 44 30 C 44 34, 37 36, 33 32 C 33 19, 19 19, 19 32 C 15 36, 8 34, 8 30 Z" />
      <path d="M 20 12 C 24 17, 28 17, 32 12" stroke-width="1.6" />
    </g>

    <!-- 6. Balok Keju Irisan Mini (Tengah Kiri) -->
    <g transform="translate(15, 100) rotate(10)">
      <path d="M 5 10 L 30 5 L 40 18 L 15 23 Z" />
      <path d="M 5 10 L 5 22 L 15 35 L 15 23" />
      <path d="M 15 35 L 40 30 L 40 18" />
      <circle cx="20" cy="12" r="2.5" />
      <circle cx="28" cy="16" r="2" />
      <circle cx="26" cy="27" r="3" />
    </g>

    <!-- 7. Taburan Rempah Khas Kemasan (Bintang renyah & butiran gurih) -->
    <!-- Bintang 4 titik -->
    <path d="M 110 40 L 112 45 L 117 47 L 112 49 L 110 54 L 108 49 L 103 47 L 108 45 Z" />
    <path d="M 240 110 L 242 114 L 246 115 L 242 116 L 240 120 L 238 116 L 234 115 L 238 114 Z" />
    <path d="M 90 230 L 91 234 L 95 235 L 91 236 L 90 240 L 89 236 L 85 235 L 89 234 Z" />
    <path d="M 170 115 L 171 118 L 174 119 L 171 120 L 170 123 L 169 120 L 166 119 L 169 118 Z" />

    <!-- Butiran keju gurih -->
    <circle cx="75" cy="90" r="2.5" fill="#3A1E0D" />
    <circle cx="150" cy="65" r="2" fill="#3A1E0D" />
    <circle cx="130" cy="180" r="2.8" />
    <circle cx="155" cy="225" r="2" fill="#3A1E0D" />
    <circle cx="215" cy="250" r="2.2" />
    <circle cx="65" cy="245" r="2" fill="#3A1E0D" />
  </g>
</svg>
